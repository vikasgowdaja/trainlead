[package]
name = "trainlead-app"
version = "0.1.0"
description = "TrainLead local desktop and Android shell"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
trainlead-core = { path = "../../crates/trainlead-core" }
async-trait.workspace = true
chrono.workspace = true
thiserror.workspace = true
dotenvy = "0.15"

[lints]
workspace = true
