[package]
name = "trainlead-server"
version = "0.1.0"
edition.workspace = true
rust-version = "1.90"

[dependencies]
trainlead-marketplace = { path = "../trainlead-marketplace" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal", "sync"] }
axum = "0.8"
utoipa = "5"
tower-http = { version = "0.6", features = ["cors", "limit", "set-header"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }
rand = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait.workspace = true

[lints]
workspace = true